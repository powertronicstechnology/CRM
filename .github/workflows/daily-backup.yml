name: Daily Supabase Backup
on:
  schedule:
    - cron: '0 20 * * *' # 01:30 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private destination before handling data
        run: python3 scripts/maintenance.py check-repo
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_PAT }}
          path: backup-repo
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Dump, encrypt and verify database backup
        run: python3 scripts/maintenance.py backup backup-repo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - name: Save encrypted backup
        working-directory: backup-repo
        run: |
          set -euo pipefail
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -- '*.gpg' '*.sha256'
          git diff --cached --quiet && { echo 'No new backup was produced'; exit 1; }
          git commit -m "Encrypted database backup ${GITHUB_RUN_ID}"
          git push
